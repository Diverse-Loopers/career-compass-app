<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Diverse Loopers</title>

    <!-- Font Awesome & BoxIcons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Favicons -->
    <link rel="icon" type="image/png"
        href="/https://diverseloopers.com/my-favicon/favicon.ico, enter /my-favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml"
        href="/https://diverseloopers.com/my-favicon/favicon.ico, enter /my-favicon/favicon.svg" />
    <link rel="shortcut icon"
        href="/https://diverseloopers.com/my-favicon/favicon.ico, enter /my-favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"
        href="/https://diverseloopers.com/my-favicon/favicon.ico, enter /my-favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DLPT" />
    <link rel="manifest"
        href="/https://diverseloopers.com/my-favicon/favicon.ico, enter /my-favicon/site.webmanifest" />

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a2a;
            /* Diverse Loopers Dark Brand Color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            padding: 20px;
        }

        .update-card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            max-width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            color: #333;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: #3b82f6;
            font-size: 32px;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 24px;
            color: #0a0a2a;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            width: 100%;
            margin: 15px 0;
            position: relative;
        }

        input {
            background-color: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 14px 18px;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        button {
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #3b82f6 0%, #ec4899 100%);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 0;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-to-login {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-to-login:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        /* Message Styles */
        #status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }

        .msg-error {
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fecaca;
        }

        .msg-success {
            background: #dcfce7;
            color: #22c55e;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>

<body>
    <div class="update-card">
        <div class="icon-circle">
            <i class='bx bx-shield-quarter'></i>
        </div>
        <h1>Update Password</h1>
        <p>Your account security is important. Please enter a strong new password to regain access.</p>

        <form id="update-form">
            <div class="input-group">
                <input type="password" id="new-password" placeholder="New Password" required minlength="6" />
            </div>
            <div class="input-group">
                <input type="password" id="confirm-password" placeholder="Confirm New Password" required
                    minlength="6" />
            </div>
            <button type="submit" id="submit-btn">Update Password</button>
        </form>

        <div id="status-msg"></div>

        <a href="login.html" class="back-to-login">
            <i class='bx bx-left-arrow-alt'></i> Back to Sign In
        </a>
    </div>

    <script>
        // --- Supabase Config ---
        const SUPABASE_URL = 'https://tjqsmkaiajdpotmafqvw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqcXNta2FpYWpkcG90bWFmcXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU5ODA3NDIsImV4cCI6MjA3MTU1Njc0Mn0.9710q9W5EFfCagj340AizUSKiOXYApy0xkTFszFjO8o';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('update-form');
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('submit-btn');

        function showMessage(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.display = 'block';
            statusMsg.className = isError ? 'msg-error' : 'msg-success';
        }

        form.onsubmit = async (e) => {
            e.preventDefault();

            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            // 1. Client-side Validation
            if (password !== confirm) {
                showMessage('Passwords do not match.', true);
                return;
            }

            // 2. Disable UI
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';

            try {
                // 3. Update Password in Supabase
                // Supabase handles the session automatically from the URL hash (#access_token=...)
                const { error } = await _supabase.auth.updateUser({ password: password });

                if (error) {
                    throw error;
                }

                showMessage('Success! Your password has been updated.');

                // 4. Redirect after success
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2500);

            } catch (err) {
                showMessage('Error: ' + err.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        };

        // Verification Check: Ensure user is actually in a reset session
        window.onload = async () => {
            const { data } = await _supabase.auth.getSession();
            if (!data.session) {
                // If there's no session, the user likely just typed this URL manually
                // without coming from the email link.
                showMessage('No valid reset session found. Please request a new link from the login page.', true);
                submitBtn.disabled = true;
            }
        };
    </script>
</body>

</html>
